<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Growth Engine — Endless Generative Organism</title>
<meta name="description" content="An endless generative organism growing forever via space colonization and collision avoidance. No reset, no terminal state." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="world" aria-label="Generative growth simulation"></canvas>


<header id="hud" rolee="banner">
    <div id="hud-left">
       <h1 id="hud-title">Growth Engine</h1>
   <span id="hud-sub">space colonization organism</span>
     </div>
     <nav id="hud-stats" aria-label="Live simulation statistics">
       <span class="stat" title="Frames per second">
         <span class="stat-label">FPS</span>
         <span class="stat-val" id="s-fps">—</span>
       </span>
       <span class="stat-sep"></span>
       <span class="stat" title="Active growth tips">
         <span class="stat-label">TIPS</span>
         <span class="stat-val" id="s-tips">0</span 
 </span>
      <span class="stat-sep"></span>
      <span class="stat" title="Total segments grown">
        <span class="stat-label">SEGS</span>
        <span class="stat-val" id="s-segs">0</span>  
     </span>
        <span class="stat-sep"></span>
        <span class="stat" title="Colony count">
          <span class="stat-label">COLS</span>
          <span class="stat-val" id="s-cols">0</span>
        </span>
      <span class="stat-sep"></span>
      <span class="stat" title="Simulation tick">
        <span class="stat-label">TICK</span>
      <span class="stat-val" id="s-tick">0</span>
      </span>
      </nav>
      </header>


<aside id="dock" aria-label="Simulation controls">
  <div class="dock-group">
  <label class="dock-label" for="ctrl-speed">SPEED</label>
      <div class="range-wrap">
        <input type="range" id="ctrl-speed" min="0.5" max="6" step="0.5" value="1"
               aria-label="Simulation speed multiplier" />    
<span id="speed-val" class="range-readout">1×</span>
</div>
</div>

<div class="dock-group">
<label class="dock-label">DISPLAY</label>
<div class="toggle-row">
<button id="ctrl-glow" class="toggle active" title="Tip glow" aria-pressed="true">◉ GLOW</button>
<button id="ctrl-ap"   class="toggle"  title="Show attraction points" aria-pressed="false">⊕ FOOD</button>
 </div>
 </div>       

   <div class="dock-group">
      <label class="dock-label">AUDIO</label>
      <button id="ctrl-audio" class="toggle" title="Ambient audio" aria-pressed="false">♪ OFF</button>
    </div>

<button id="ctrl-home" class="dock-btn" aria-label="Reset camera to origin">⌖ RESET VIEW</button>
  </aside>


<aside id="inspector" class="hidden" aria-live="polite" aria-label="Colony inspector">
    <div id="insp-header">
      <div id="insp-name-wrap">
        <span id="insp-badge">●</span>
        <span id="insp-name">—</span>
      </div>
